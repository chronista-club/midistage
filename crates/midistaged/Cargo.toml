[package]
name = "midistaged"
version.workspace = true
edition.workspace = true
# club-unison 2 の MSRV。既存 configurator crates の下限は変更しない。
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "アプリ非依存の MIDI 接続・引き継ぎサービス"

[dependencies]
midistage-protocol = { path = "../midistage-protocol" }
midistage-profiles = { path = "../midistage-profiles" }
club-unison = "2.0.0"
tokio = { version = "1.52", features = ["full"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11"
coremidi = "0.9.2"
coremidi-sys = "3.2.1"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3"
midistage-client = { path = "../midistage-client" }

# Windows MIDI Services（design 07）。binding は src/winmidi_bindings.rs（scripts/winmidi.sh bindings）
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-collections = "0.3"
midistage-core.workspace = true
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Devices_Enumeration", "Data_Json"] }
