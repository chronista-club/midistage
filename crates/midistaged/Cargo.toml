[package]
name = "midistaged"
version.workspace = true
edition.workspace = true
# club-unison 2 の MSRV。既存 configurator crates の下限は変更しない。
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "アプリ非依存の MIDI 接続・引き継ぎサービス"

[dependencies]
midistage-protocol = { path = "../midistage-protocol" }
midistage-profiles = { path = "../midistage-profiles" }
club-unison = "2.0.0"
tokio = { version = "1.52", features = ["full"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11"
coremidi = "0.9.2"
coremidi-sys = "3.2.1"

[dev-dependencies]
tempfile = "3"
midistage-client = { path = "../midistage-client" }
