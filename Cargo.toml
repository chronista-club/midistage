[workspace]
resolver = "2"
members = [
    "crates/midistage-core",
    "crates/midistage-cli",
    "crates/midistage-keystage",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/chronista-club/midistage"
authors = ["Mako <mito@chronista.club>"]

[workspace.dependencies]
midistage-core = { path = "crates/midistage-core" }
midistage-keystage = { path = "crates/midistage-keystage" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# KDL parser — knus を仮選定 (fleetflow / bikeboy で dogfood 済み)、 v0-alpha 実装時に再評価
knus = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
